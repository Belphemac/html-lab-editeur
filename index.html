<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="Éditeur HTML mobile avec aperçu immédiat, utilisable hors ligne.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>HTML Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2e;--line:#25334d;--muted:#9aabc4;--blue:#4f8cff;--green:#24c18a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px system-ui,-apple-system,sans-serif;min-height:100vh}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#0e1628;position:sticky;top:0;z-index:3}.brand{font-weight:750;letter-spacing:.2px}.brand span{color:#76a6ff}.actions{display:flex;gap:8px}button,.filebtn{border:1px solid var(--line);background:#1a2740;color:#f4f7ff;padding:10px 13px;border-radius:10px;font-weight:650;font-size:14px;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.run{background:var(--green);border-color:var(--green);color:#062b20}main{max-width:900px;margin:auto;padding:14px;display:grid;gap:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button{padding:8px 10px;font-size:13px}textarea{width:100%;height:42vh;min-height:230px;max-height:55vh;resize:vertical;background:#080d18;color:#dce8ff;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline:none}textarea:focus{border-color:#548eff;box-shadow:0 0 0 2px #548eff30}.previewHead{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;font-weight:700}.previewHead small{font-weight:400;color:var(--muted)}iframe{display:block;width:100%;height:38vh;min-height:230px;background:white;border:1px solid var(--line);border-radius:12px}.hint{font-size:12px;line-height:1.45;color:var(--muted);padding:0 3px}.fileInput{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23334e;padding:10px 16px;border-radius:20px;display:none;z-index:5;font-size:13px;box-shadow:0 4px 20px #0007}@media(min-width:800px){main{grid-template-columns:1fr 1fr;max-width:1200px;padding:20px}.editor{display:flex;flex-direction:column}.toolbar{min-height:40px}textarea{height:calc(100vh - 180px);max-height:none;flex:1}.preview{display:flex;flex-direction:column}iframe{height:calc(100vh - 180px);flex:1}.hint{grid-column:1/-1}}
</style></head>
<body><header><div class="brand">&lt;/&gt; <span>HTML</span> Lab</div><div class="actions"><button id="paste">Coller</button><button class="primary run" id="run">▶ Exécuter</button></div></header>
<main><section class="editor"><div class="toolbar"><span>Ton code HTML</span><div class="tools"><button id="open">Ouvrir</button><button id="save">Enregistrer</button><button id="download">Exporter</button><button id="clear">Effacer</button></div></div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Éditeur HTML"></textarea><input class="fileInput" id="file" type="file" accept=".html,.htm,.txt,text/html,text/plain"></section>
<section class="preview"><div class="previewHead"><span>Aperçu</span><small id="status">Prêt</small></div><iframe id="view" title="Aperçu de la page" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></section><p class="hint">Le code est enregistré automatiquement sur cet appareil. L’aperçu est isolé du reste de l’application. Si ton HTML charge des images ou bibliothèques depuis Internet, une connexion sera nécessaire.</p></main><div id="toast"></div>
<script>
const starter='<!doctype html>\n<html lang="fr">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Ma page</title>\n  <style>body{font-family:Arial,sans-serif;padding:24px;background:#f3f6fc;color:#17233c}h1{color:#3267d5}</style>\n</head>\n<body>\n  <h1>Bonjour !</h1>\n  <p>Remplace ce code par celui généré par ton IA, puis touche Exécuter.</p>\n  <button onclick="alert(\'Ça marche !\')">Tester le bouton</button>\n</body>\n</html>';
const code=document.querySelector('#code'),frame=document.querySelector('#view'),status=document.querySelector('#status'),toastEl=document.querySelector('#toast');let timer;
function toast(s){toastEl.textContent=s;toastEl.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toastEl.style.display='none',2100)}
code.value=localStorage.getItem('html-lab-code')||starter;let first=true;
function run(){frame.srcdoc=code.value;status.textContent='Mis à jour';localStorage.setItem('html-lab-code',code.value);if(first){first=false;toast('Aperçu lancé')}}
code.addEventListener('input',()=>{localStorage.setItem('html-lab-code',code.value);status.textContent='Modifié'});document.querySelector('#run').onclick=run;run();
document.querySelector('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){code.value=t;localStorage.setItem('html-lab-code',t);status.textContent='Code collé';toast('Code collé — touche Exécuter')}else toast('Presse-papiers vide')}catch{code.focus();toast('Appuie longuement dans la zone puis « Coller »')}};
document.querySelector('#open').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(f){code.value=await f.text();localStorage.setItem('html-lab-code',code.value);status.textContent=f.name;toast('Fichier chargé')}e.target.value=''};
document.querySelector('#save').onclick=()=>{localStorage.setItem('html-lab-code',code.value);toast('Code enregistré sur cet appareil')};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/html;charset=utf-8'}));a.download='ma-page.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Fichier HTML exporté')};document.querySelector('#clear').onclick=()=>{if(confirm('Effacer le code actuel ?')){code.value='';localStorage.removeItem('html-lab-code');status.textContent='Vide';frame.srcdoc='';toast('Éditeur vidé')}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
